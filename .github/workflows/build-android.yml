name: Build AI Scanner Trading Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android SDK platforms and tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          cd android
          ./gradlew assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-scanner-trading-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk